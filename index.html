    <script>
      // Apply the saved theme and language before first paint (no flash of the
      // wrong theme or the wrong text direction)
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("theme") || "light"
      );
      var savedLang = localStorage.getItem("lang") === "ar" ? "ar" : "en";
      document.documentElement.setAttribute("lang", savedLang);
      document.documentElement.setAttribute(
        "dir",
        savedLang === "ar" ? "rtl" : "ltr"
      );
